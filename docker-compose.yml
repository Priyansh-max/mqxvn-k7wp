services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CACHE_DIR: /data/cache
      CORS_ORIGINS: "*"
    volumes:
      - ./data/cache:/data/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
